<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <style>
    .title{font-weight:bold;font-size:16px}
    .cls{fill:#f5f5f5;stroke:#333;stroke-width:1.5}
    .iface{fill:#e8f5e9;stroke:#2e7d32}
    .repo{fill:#e3f2fd;stroke:#1565c0}
    .pipeline{fill:#fff3e0;stroke:#e65100}
    .cache{fill:#f3e5f5;stroke:#6a1b9a}
    .obs{fill:#fce4ec;stroke:#c2185b}
    .tool{fill:#f0f4c3;stroke:#827717}
    .label{fill:#111}
    .stereo{fill:#555;font-style:italic;font-size:11px}
    .arrow{stroke:#333;stroke-width:1.4;fill:none;marker-end:url(#arr)}
    .dashed{stroke:#666;stroke-width:1.2;fill:none;stroke-dasharray:5,4;marker-end:url(#arrT)}
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <text x="600" y="26" text-anchor="middle" class="title">RAG Core — Class Diagram</text>

  <!-- CatalogRepository -->
  <rect x="40" y="60" width="240" height="120" rx="4" class="cls iface"/>
  <text x="160" y="80" text-anchor="middle" class="stereo">&lt;&lt;interface&gt;&gt; Repository</text>
  <text x="160" y="98" text-anchor="middle" class="label" font-weight="bold">CatalogRepository</text>
  <line x1="40" y1="106" x2="280" y2="106" stroke="#333"/>
  <text x="52" y="124" class="label">+ get_product()</text>
  <text x="52" y="140" class="label">+ search_by_text()</text>
  <text x="52" y="156" class="label">+ search_by_embedding()</text>
  <text x="52" y="172" class="label">+ get_products_by_ids()</text>

  <rect x="40" y="220" width="240" height="48" rx="4" class="cls repo"/>
  <text x="160" y="248" text-anchor="middle" class="label">PostgresCatalogRepository</text>

  <rect x="40" y="280" width="240" height="48" rx="4" class="cls repo"/>
  <text x="160" y="308" text-anchor="middle" class="label">InMemoryCatalogRepository</text>

  <!-- Retriever -->
  <rect x="340" y="60" width="220" height="100" rx="4" class="cls iface"/>
  <text x="450" y="80" text-anchor="middle" class="stereo">&lt;&lt;interface&gt;&gt; Strategy</text>
  <text x="450" y="98" text-anchor="middle" class="label" font-weight="bold">Retriever</text>
  <line x1="340" y1="106" x2="560" y2="106" stroke="#333"/>
  <text x="352" y="124" class="label">+ name: str</text>
  <text x="352" y="140" class="label">+ retrieve(query, top_k)</text>

  <rect x="340" y="200" width="220" height="42" rx="4" class="cls cls"/>
  <text x="450" y="226" text-anchor="middle" class="label">BM25Retriever</text>

  <rect x="340" y="252" width="220" height="42" rx="4" class="cls cls"/>
  <text x="450" y="278" text-anchor="middle" class="label">DenseRetriever</text>

  <!-- Cross-encoder + Pipeline -->
  <rect x="620" y="60" width="230" height="80" rx="4" class="cls"/>
  <text x="735" y="90" text-anchor="middle" class="label" font-weight="bold">CrossEncoderReranker</text>
  <text x="632" y="118" class="label">+ rerank()</text>

  <rect x="620" y="170" width="230" height="100" rx="4" class="cls pipeline"/>
  <text x="735" y="190" text-anchor="middle" class="stereo">&lt;&lt;Pipeline&gt;&gt;</text>
  <text x="735" y="208" text-anchor="middle" class="label" font-weight="bold">HybridRetrievalPipeline</text>
  <line x1="620" y1="216" x2="850" y2="216" stroke="#333"/>
  <text x="632" y="234" class="label">+ retrieve()</text>
  <text x="632" y="250" class="label">- _reciprocal_rank_fusion()</text>

  <!-- Caches -->
  <rect x="900" y="60" width="240" height="42" rx="4" class="cls cache"/>
  <text x="1020" y="86" text-anchor="middle" class="label">ExactCache (Decorator)</text>

  <rect x="900" y="112" width="240" height="42" rx="4" class="cls cache"/>
  <text x="1020" y="138" text-anchor="middle" class="label">SemanticCache (Decorator)</text>

  <!-- Observer -->
  <rect x="40" y="400" width="240" height="100" rx="4" class="cls obs"/>
  <text x="160" y="420" text-anchor="middle" class="stereo">&lt;&lt;interface&gt;&gt; Observer</text>
  <text x="160" y="438" text-anchor="middle" class="label" font-weight="bold">CatalogObserver</text>
  <line x1="40" y1="446" x2="280" y2="446" stroke="#333"/>
  <text x="52" y="464" class="label">+ on_catalog_update()</text>

  <rect x="40" y="520" width="240" height="42" rx="4" class="cls obs"/>
  <text x="160" y="546" text-anchor="middle" class="label">CacheInvalidator</text>

  <rect x="340" y="400" width="260" height="100" rx="4" class="cls obs"/>
  <text x="470" y="420" text-anchor="middle" class="stereo">&lt;&lt;Subject Pub-Sub&gt;&gt;</text>
  <text x="470" y="438" text-anchor="middle" class="label" font-weight="bold">CatalogEventBus</text>
  <line x1="340" y1="446" x2="600" y2="446" stroke="#333"/>
  <text x="352" y="464" class="label">+ subscribe()</text>
  <text x="352" y="480" class="label">+ publish()</text>

  <!-- ToolRegistry + Agent -->
  <rect x="660" y="400" width="240" height="100" rx="4" class="cls tool"/>
  <text x="780" y="420" text-anchor="middle" class="stereo">&lt;&lt;Registry Factory&gt;&gt;</text>
  <text x="780" y="438" text-anchor="middle" class="label" font-weight="bold">ToolRegistry</text>
  <line x1="660" y1="446" x2="900" y2="446" stroke="#333"/>
  <text x="672" y="464" class="label">+ register()</text>
  <text x="672" y="480" class="label">+ execute()</text>
  <text x="672" y="496" class="label">+ get_openai_tools_schema()</text>

  <rect x="660" y="530" width="240" height="60" rx="4" class="cls"/>
  <text x="780" y="556" text-anchor="middle" class="label" font-weight="bold">AgentLoop</text>
  <text x="672" y="578" class="label">+ run() AsyncIterator</text>

  <!-- Arrows -->
  <path class="dashed" d="M 160 220 L 160 180"/>
  <path class="dashed" d="M 160 280 L 160 180"/>
  <path class="dashed" d="M 450 200 L 450 160"/>
  <path class="dashed" d="M 450 252 L 450 160"/>
  <path class="arrow" d="M 340 220 L 280 190"/>
  <path class="arrow" d="M 340 272 L 280 230"/>
  <path class="arrow" d="M 620 220 L 560 140"/>
  <path class="arrow" d="M 735 170 L 735 140"/>
  <path class="dashed" d="M 160 520 L 160 500"/>
  <path class="arrow" d="M 340 450 L 280 450"/>
  <path class="arrow" d="M 280 520 L 40 520"/>
  <path class="arrow" d="M 780 530 L 780 500"/>
</svg>
