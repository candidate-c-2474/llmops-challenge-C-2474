[project]
name = "roomfit-copilot"
version = "0.1.0"
description = "RoomFit Copilot — AI furniture shopping assistant with hybrid RAG"
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "apps"]
python_files = ["test_*.py"]
pythonpath = [
    "packages/inference_gateway/src",
    "packages/rag_core/src",
    "apps/api/src"
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["packages", "apps"]
