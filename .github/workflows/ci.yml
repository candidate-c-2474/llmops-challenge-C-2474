name: CI Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  anonymity-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Anonymity Gate
        run: |
          chmod +x scripts/check_anonymity.sh
          ./scripts/check_anonymity.sh

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pydantic pydantic-settings httpx redis structlog numpy sentence-transformers sse-starlette asyncpg

      - name: Install local packages in editable mode
        run: |
          pip install -e packages/inference_gateway
          pip install -e packages/rag_core

      - name: Run Package Unit and Integration Tests
        run: |
          pytest packages/inference_gateway/tests -v
          pytest packages/rag_core/tests -v
          pytest apps/api/tests -v
