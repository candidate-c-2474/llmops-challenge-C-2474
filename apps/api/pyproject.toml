[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roomfit-api"
version = "0.1.0"
description = "RoomFit Copilot API — FastAPI with SSE streaming"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
    "structlog>=24.1.0",
    "inference-gateway",
    "rag-core",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
