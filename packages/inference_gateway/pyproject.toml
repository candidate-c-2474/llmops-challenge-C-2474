[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inference-gateway"
version = "0.1.0"
description = "LLM inference gateway with circuit breaker, fallback, and metrics"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.hatch.build.targets.wheel]
packages = ["src/inference_gateway"]
