[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-core"
version = "0.1.0"
description = "RAG pipeline core: hybrid retrieval, caching, agent loop"
requires-python = ">=3.10"
dependencies = [
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.0.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "fakeredis>=2.21"]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core"]
