services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: roomfit-postgres
    environment:
      POSTGRES_DB: roomfit
      POSTGRES_USER: roomfit
      POSTGRES_PASSWORD: roomfit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomfit -d roomfit"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: roomfit-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: roomfit-api
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface:ro
      - /opt/prom-wheelhouse:/opt/prom-wheelhouse:ro
    environment:
      DATABASE_URL: postgresql://roomfit:roomfit@postgres:5432/roomfit
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: roomfit
      POSTGRES_PASSWORD: roomfit
      POSTGRES_DATABASE: roomfit
      REDIS_HOST: redis
      REDIS_PORT: 6379
      VLLM_URL: http://172.25.12.152:8001/v1
      LLAMACPP_URL: http://172.25.12.152:8001/v1
      USE_FAKE_BACKEND: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONPATH: "/opt/prom-wheelhouse"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata: